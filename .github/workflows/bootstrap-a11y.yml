name: Temporary accessibility tooling bootstrap

on:
  push:
    branches:
      - test/accessibility-audit

permissions: {}

jobs:
  resolve:
    if: github.ref == 'refs/heads/test/accessibility-audit' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolve pinned Playwright accessibility tooling
        run: npm install --save-dev --save-exact @axe-core/playwright --no-audit --no-fund
      - name: Verify clean installation from the committed npm lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify existing quality gates
        run: npm run check
      - name: Commit resolved accessibility tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "build: pin Playwright axe accessibility tooling"
          git push origin HEAD:refs/heads/test/accessibility-audit
