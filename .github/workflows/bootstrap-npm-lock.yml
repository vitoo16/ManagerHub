name: Temporary npm lockfile bootstrap

on:
  push:
    branches:
      - chore/npm-reproducible-ci

permissions: {}

jobs:
  generate:
    if: github.ref == 'refs/heads/chore/npm-reproducible-ci' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve and lock declared npm workspace dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install from generated lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify existing TypeScript, tests and production bundle
        run: npm run check
      - name: Commit the real npm resolution to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && { echo 'No package-lock.json changes found'; exit 1; }
          git commit -m "build: pin resolved npm workspace dependency graph"
          git push origin HEAD:refs/heads/chore/npm-reproducible-ci
