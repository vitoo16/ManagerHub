name: Temporary lint dependency bootstrap

on:
  push:
    branches:
      - chore/first-party-lint-format

permissions: {}

jobs:
  resolve:
    if: github.ref == 'refs/heads/chore/first-party-lint-format' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolve exact ESLint and formatter versions into npm lockfile
        run: npm install --save-dev --save-exact eslint @eslint/js typescript-eslint prettier --no-audit --no-fund
      - name: Verify clean dependency resolution
        run: npm ci --no-audit --no-fund
      - name: Verify existing application gates
        run: npm run check
      - name: Commit resolved tool versions on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "build: pin ESLint, typescript-eslint and Prettier toolchain"
          git push origin HEAD:refs/heads/chore/first-party-lint-format
