name: ManagerHub checks
on:
  push:
    branches: [main]
  pull_request:

# New pushes supersede older unmerged CI jobs to reduce wasted runtime.
concurrency:
  group: managerhub-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Preserve main branch verification; cancel only superseded revisions of one PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: First-party lint (TypeScript 7 compatible)
        run: npm run lint
      - name: Formatting baseline (workspace manifests and config)
        run: npm run format:check
      - name: TypeScript strict typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: managerhub-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: E2E / desktop and mobile
        run: npm run test:e2e
      - name: Archive failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
